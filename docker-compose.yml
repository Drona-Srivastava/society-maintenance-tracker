services:
  postgres:
    image: postgres:17
    container_name: society-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: society
      POSTGRES_PASSWORD: society_dev
      POSTGRES_DB: society_tracker

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U society -d society_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    container_name: society-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql+psycopg://society:society_dev@postgres:5432/society_tracker

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: