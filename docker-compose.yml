services:
  postgres:
    image: postgres:17
    container_name: society-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: society
      POSTGRES_PASSWORD: society_dev
      POSTGRES_DB: society_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: