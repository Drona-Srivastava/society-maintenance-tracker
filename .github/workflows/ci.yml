name: Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AZURE_SUBSCRIPTION_ID: 2e343d2b-52f3-465c-b23c-c32ef2ca365f
  ACR_NAME: societymaintenanceacr
  IMAGE_NAME: society-maintenance-tracker
  RESOURCE_GROUP: society-maintenance-rg
  CONTAINER_APP_NAME: society-backend
  MIGRATION_JOB_NAME: society-db-migration

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: society
          POSTGRES_PASSWORD: society_test
          POSTGRES_DB: society_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U society -d society_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://society:society_test@localhost:5432/society_tracker_test
          TEST_DATABASE_URL: postgresql+psycopg://society:society_test@localhost:5432/society_tracker_test
          JWT_SECRET: test-secret-for-ci
          BREVO_API_KEY: test-brevo-key
          EMAIL_FROM: test@example.com
        run: pytest -v

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ./backend

  security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image for scanning
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ./backend

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

  deploy:
    name: Push Image, Migrate DB and Deploy
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 5a35a2b4-88fe-451f-b1ee-8e5a8181bba1
          tenant-id: 431c5847-2a28-4bbb-9e39-d7aaffe89d97
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Build production Docker image
        run: |
          docker build \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ./backend

      - name: Push Docker image to ACR
        run: |
          docker push \
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify Azure context
        run: |
          az account show \
            --query "{subscription:id,name:name,tenantId:tenantId}" \
            -o table

          az containerapp list \
            --subscription ${{ env.AZURE_SUBSCRIPTION_ID }} \
            --query "[].{name:name,resourceGroup:resourceGroup,location:location}" \
            -o table

      # ---------------------------------------------------------
      # DATABASE MIGRATION
      # ---------------------------------------------------------

      - name: Update migration job image
        run: |
          az containerapp job update \
            --subscription ${{ env.AZURE_SUBSCRIPTION_ID }} \
            --name ${{ env.MIGRATION_JOB_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Start database migration
        run: |
          EXECUTION_NAME=$(az containerapp job start \
            --subscription ${{ env.AZURE_SUBSCRIPTION_ID }} \
            --name ${{ env.MIGRATION_JOB_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query name \
            -o tsv)

          echo "EXECUTION_NAME=$EXECUTION_NAME" >> "$GITHUB_ENV"

          echo "Started migration:"
          echo "$EXECUTION_NAME"

      - name: Wait for database migration
        shell: bash
        run: |
          echo "Waiting for migration execution: $EXECUTION_NAME"

          for i in {1..60}; do
            STATUS=$(az containerapp job execution show \
              --subscription ${{ env.AZURE_SUBSCRIPTION_ID }} \
              --name ${{ env.MIGRATION_JOB_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --job-execution-name "$EXECUTION_NAME" \
              --query "properties.status" \
              -o tsv)

            echo "Migration status: $STATUS"

            if [ "$STATUS" = "Succeeded" ]; then
              echo "Database migration succeeded."
              exit 0
            fi

            if [ "$STATUS" = "Failed" ]; then
              echo "Database migration failed."
              exit 1
            fi

            sleep 10
          done

          echo "Migration timed out."
          exit 1

      # ---------------------------------------------------------
      # APPLICATION DEPLOYMENT
      # ---------------------------------------------------------

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --subscription ${{ env.AZURE_SUBSCRIPTION_ID }} \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify deployment
        run: |
          IMAGE=$(az containerapp show \
            --subscription ${{ env.AZURE_SUBSCRIPTION_ID }} \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.template.containers[0].image" \
            -o tsv)

          EXPECTED="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          echo "Expected image: $EXPECTED"
          echo "Deployed image: $IMAGE"

          if [ "$IMAGE" != "$EXPECTED" ]; then
            echo "Deployment verification failed"
            exit 1
          fi

          echo "Deployment verified successfully."

      - name: Verify backend health
        shell: bash
        run: |
          FQDN=$(az containerapp show \
            --subscription ${{ env.AZURE_SUBSCRIPTION_ID }} \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)

          echo "Backend: https://$FQDN"

          for i in {1..30}; do
            if curl -fsS "https://$FQDN/health"; then
              echo
              echo "Backend health check passed."
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 10
          done

          echo "Backend health check failed."
          exit 1