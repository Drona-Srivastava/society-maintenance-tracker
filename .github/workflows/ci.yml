name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: society
          POSTGRES_PASSWORD: society_test
          POSTGRES_DB: society_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U society -d society_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://society:society_test@localhost:5432/society_tracker_test
          TEST_DATABASE_URL: postgresql+psycopg://society:society_test@localhost:5432/society_tracker_test
          JWT_SECRET: test-secret-for-ci
        run: pytest -v

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t society-maintenance-tracker:${{ github.sha }} \
            ./backend

  security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image for scanning
        run: |
          docker build \
            -t society-maintenance-tracker:${{ github.sha }} \
            ./backend

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: society-maintenance-tracker:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

  deploy:
    name: Push Image to ACR and Deploy
    runs-on: ubuntu-latest
    needs: security

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 5a35a2b4-88fe-451f-b1ee-8e5a8181bba1
          tenant-id: 431c5847-2a28-4bbb-9e39-d7aaffe89d97
          subscription-id: 2e343d2b-52f3-465c-b23c-c32ef2ca365f

      - name: Login to Azure Container Registry
        run: |
          az acr login --name societymaintenanceacr

      - name: Build and push Docker image
        run: |
          docker build \
            -t societymaintenanceacr.azurecr.io/society-maintenance-tracker:${{ github.sha }} \
            ./backend

          docker push \
            societymaintenanceacr.azurecr.io/society-maintenance-tracker:${{ github.sha }}

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name society-backend \
            --resource-group society-maintenance-rg \
            --image societymaintenanceacr.azurecr.io/society-maintenance-tracker:${{ github.sha }}

      - name: Verify deployment
        run: |
          IMAGE=$(az containerapp show \
            --name society-backend \
            --resource-group society-maintenance-rg \
            --query "properties.template.containers[0].image" \
            -o tsv)

          EXPECTED="societymaintenanceacr.azurecr.io/society-maintenance-tracker:${{ github.sha }}"

          echo "Expected image: $EXPECTED"
          echo "Deployed image: $IMAGE"

          if [ "$IMAGE" != "$EXPECTED" ]; then
            echo "Deployment verification failed"
            exit 1
          fi

          echo "Deployment verified successfully"